---
- name: test
  gather_facts: false
  hosts: all
  vars:
    ansible_ssh_user: ubuntu
  become: yes

  pre_tasks:
    - name: Validating the ssh port is open
      wait_for:
        host: "{{ ansible_host }}"
        port: 22
        delay: 5
        timeout: 300
        state: started
        search_regex: OpenSSH

  tasks:
    - name: Check connection and print hostname
      command: hostname
      register: result

    - name: Show result
      debug:
        var: result.stdout
